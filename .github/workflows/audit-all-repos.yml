name: Auditar y Mejorar todos mis repos

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  audit-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install PyGithub

      - name: Obtener lista de repositorios
        run: |
          python -c "
          import os, json
          from github import Github, Auth
          token = os.environ['SECRET_TOKEN']
          if not token:
              print('❌ ERROR: Secret Yave no configurado')
              exit(1)
          g = Github(auth=Auth.Token(token))
          user = g.get_user()
          repos = [repo.name for repo in user.get_repos() if not repo.fork and repo.name != 'lean_audit_project']
          with open('repos.json', 'w') as f:
              json.dump(repos, f)
          print(f'✅ Se encontraron {len(repos)} repositorios')
          "
        env:
          SECRET_TOKEN: ${{ secrets.Yave }}
        shell: bash

      - name: Auditar y corregir cada repositorio
        run: |
          python -c "
          import os, json, subprocess, sys, time
          from pathlib import Path

          token = os.environ['SECRET_TOKEN']
          if not token:
              print('❌ Token no disponible')
              sys.exit(1)

          with open('repos.json') as f:
              repos = json.load(f)

          if not repos:
              print('ℹ️  No hay repositorios para auditar.')
              sys.exit(0)

          for repo in repos:
              print(f'📁 Procesando {repo}...')
              repo_url = f'https://{token}@github.com/{os.environ["GITHUB_REPOSITORY_OWNER"]}/{repo}.git'
              try:
                  Path(f'./repos/{repo}').mkdir(parents=True, exist_ok=True)
                  subprocess.run(['git', 'clone', repo_url, f'./repos/{repo}'], check=True, capture_output=True)
              except Exception as e:
                  print(f'❌ Error clonando {repo}: {e}')
                  continue

              try:
                  subprocess.run(['python3', 'auditor_completo.py', f'./repos/{repo}'], capture_output=True, text=True, timeout=120)
              except Exception as e:
                  print(f'❌ Error auditoría en {repo}: {e}')
                  continue

              try:
                  with open('reporte_final.json', 'r') as f:
                      import json as jsonlib
                      data = jsonlib.load(f)
                      if data.get('meta', {}).get('errors', 0) > 0:
                          print(f'🔍 Se encontraron {data["meta"]["errors"]} errores en {repo}')
                          subprocess.run(['python3', 'auto_fix.py', f'./repos/{repo}'], check=False, capture_output=True)
                          os.chdir(f'./repos/{repo}')
                          status = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True)
                          if status.stdout:
                              subprocess.run(['git', 'config', 'user.name', 'auditor-agent'], check=True)
                              subprocess.run(['git', 'config', 'user.email', 'auditor@bot.com'], check=True)
                              subprocess.run(['git', 'add', '.'], check=True)
                              subprocess.run(['git', 'commit', '-m', 'Auto-fix: px→dp, Left/Right→Start/End'], check=True)
                              subprocess.run(['git', 'push', 'origin', f'HEAD:fix/auto-audit'], check=False)
                              subprocess.run(['gh', 'pr', 'create', '--title', 'Auto-fix de auditoría', '--body', 'Correcciones automáticas generadas.', '--base', 'main', '--head', 'fix/auto-audit'], check=False)
                          os.chdir('../..')
                      else:
                          print(f'✅ {repo} sin errores.')
              except Exception as e:
                  print(f'❌ Error procesando {repo}: {e}')
          "
        env:
          SECRET_TOKEN: ${{ secrets.Yave }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash

      - name: Resumen final
        run: |
          echo "## 📊 Resumen de auditoría masiva" >> $GITHUB_STEP_SUMMARY
          echo "Se han auditado todos los repositorios." >> $GITHUB_STEP_SUMMARY
          echo "Los PRs se han creado automáticamente para los repos con violaciones." >> $GITHUB_STEP_SUMMARY
          echo "✅ Workflow completado." >> $GITHUB_STEP_SUMMARY
